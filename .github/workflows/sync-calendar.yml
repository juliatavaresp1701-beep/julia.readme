name: Sync availability from Google Calendar

on:
  schedule:
    # Every 5 minutes - the shortest interval GitHub Actions allows. Scheduled
    # runs are best-effort and can be delayed or skipped under load, so treat
    # this as "usually within 5-10 minutes", not a guarantee. Runs that find no
    # change commit nothing, so this does not churn the site.
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    # Rebuild immediately when the bookable hours change.
    paths:
      - 'scripts/calendar-config.json'
      - 'scripts/sync-calendar.mjs'

# Needed to push the regenerated availability.json back to the branch.
permissions:
  contents: write

concurrency:
  group: sync-calendar
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Read calendar and rebuild availability.json
        env:
          GOOGLE_ICS_URL: ${{ secrets.GOOGLE_ICS_URL }}
        run: node scripts/sync-calendar.mjs

      - name: Commit if the availability changed
        run: |
          if [[ -z "$(git status --porcelain availability.json)" ]]; then
            echo "No change in availability."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add availability.json
          git commit -m "Update availability from Google Calendar"
          git push
